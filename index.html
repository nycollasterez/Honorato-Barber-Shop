    <!-- Banner discreto de instalacao do App Honorato Barber Shop -->
    <div id="pwa-install-banner" style="display:none; position:fixed; bottom:20px; left:16px; right:16px; max-width:400px; margin:0 auto; background:rgba(18,18,18,0.96); border:1px solid #C5A059; border-radius:14px; padding:12px 16px; z-index:999999; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 12px 36px rgba(0,0,0,0.85); align-items:center; justify-content:space-between; gap:12px;">
      <div style="display:flex; align-items:center; gap:12px;">
        <img src="/logo.png?v=2" alt="Honorato App" style="width:42px; height:42px; object-fit:contain; border-radius:8px; background:#0B0B0B; padding:3px; border:1px solid rgba(197,160,89,0.3);" />
        <div style="text-align:left;">
          <div style="color:#FFFFFF; font-weight:700; font-size:13.5px; line-height:1.2;">Honorato Barber Shop</div>
          <div style="color:#A1A1AA; font-size:11px;">Instale o app para tela cheia</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <button id="pwa-install-btn" style="background:#B08D57; color:#000; font-weight:700; font-size:12px; padding:7px 13px; border-radius:8px; border:none; cursor:pointer; white-space:nowrap;">Instalar</button>
        <button id="pwa-close-btn" style="background:transparent; color:#888; border:none; font-size:18px; cursor:pointer; padding:4px 6px;">✕</button>
      </div>
    </div>

    <script>
      // 1. Registro de Service Worker para PWA (exigido pelo Google Chrome / Android para instalar como app)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('Service Worker Honorato registrado:', reg.scope);
          }).catch(function(err) {
            console.warn('Erro ao registrar Service Worker:', err);
          });
        });
      }

      // 2. Logica de Instalacao do App PWA
      let deferredPrompt = null;
      const banner = document.getElementById('pwa-install-banner');
      const installBtn = document.getElementById('pwa-install-btn');
      const closeBtn = document.getElementById('pwa-close-btn');

      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const isDismissed = sessionStorage.getItem('pwa_banner_dismissed') === 'true';

      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        if (!isStandalone && !isDismissed && banner) {
          banner.style.display = 'flex';
        }
      });

      if (installBtn) {
        installBtn.addEventListener('click', async function() {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const choiceResult = await deferredPrompt.userChoice;
            deferredPrompt = null;
            if (banner) banner.style.display = 'none';
          } else {
            // Caso seja iOS Safari (que nao suporta beforeinstallprompt nativo)
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            if (isIOS) {
              alert("Para instalar no seu iPhone: toque no ícone de Compartilhar (botão com quadrado e seta para cima no Safari) e depois em 'Adicionar à Tela de Início'.");
            } else {
              alert("Para instalar o app: abra as opções do navegador (três pontinhos no topo) e toque em 'Instalar aplicativo' ou 'Adicionar à tela inicial'.");
            }
          }
        });
      }

      if (closeBtn && banner) {
        closeBtn.addEventListener('click', function() {
          banner.style.display = 'none';
          sessionStorage.setItem('pwa_banner_dismissed', 'true');
        });
      }

      // Exibir tambem no iOS Safari caso ainda nao tenha instalado
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS && !isStandalone && !isDismissed && banner) {
        setTimeout(function() {
          banner.style.display = 'flex';
        }, 2500);
      }
    </script>
